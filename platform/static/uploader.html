<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; font-family: 'Inter', sans-serif; font-size: 13px; }
.box {
  border: 1px dashed rgba(33,150,243,0.4);
  border-radius: 8px; padding: 10px 14px;
  background: rgba(13,33,57,0.6);
}
.box label { color: #90a4ae; font-size: 12px; display: block; margin-bottom: 6px; }
input[type=file] { color: #90caf9; font-size: 12px; width: 100%; cursor: pointer; }
.bar-wrap { margin-top: 8px; background: #0a1628; border-radius: 4px; height: 5px; display: none; }
.bar { height: 5px; border-radius: 4px; background: #2196f3; width: 0; transition: width .15s; }
.status { margin-top: 5px; font-size: 11px; color: #64b5f6; min-height: 14px; }
</style>
</head>
<body>
<div class="box">
  <label id="lbl">Choisir un fichier Sentinel-1 (.zip)</label>
  <input type="file" id="fi" accept=".zip">
  <div class="bar-wrap" id="bw"><div class="bar" id="bar"></div></div>
  <div class="status" id="st"></div>
</div>
<script>
  // Récupérer le label depuis les paramètres URL
  const params = new URLSearchParams(window.location.search);
  const label = params.get('label') || 'Choisir un fichier Sentinel-1 (.zip)';
  const key   = params.get('key') || 'file';
  document.getElementById('lbl').textContent = label;

  document.getElementById('fi').addEventListener('change', function() {
    const file = this.files[0];
    if (!file) return;
    const bw  = document.getElementById('bw');
    const bar = document.getElementById('bar');
    const st  = document.getElementById('st');
    bw.style.display = 'block';
    st.textContent = 'Préparation...';

    // URL absolue basée sur la page parente (même hôte, port 8503)
    const uploadUrl = window.location.origin + '/api/upload';

    const xhr = new XMLHttpRequest();
    xhr.open('POST', uploadUrl);
    xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');

    xhr.upload.onprogress = function(e) {
      if (!e.lengthComputable) return;
      const pct = Math.round(e.loaded / e.total * 100);
      bar.style.width = pct + '%';
      const mb_done  = (e.loaded  / 1e6).toFixed(0);
      const mb_total = (e.total   / 1e6).toFixed(0);
      st.style.color   = '#64b5f6';
      st.textContent   = 'Upload... ' + pct + '%  (' + mb_done + ' / ' + mb_total + ' MB)';
    };

    xhr.onload = function() {
      if (xhr.status === 200) {
        bar.style.background = '#66bb6a';
        bar.style.width = '100%';
        st.style.color = '#66bb6a';
        st.textContent = '✓ ' + file.name;
        // Notifier la page parente Streamlit
        window.parent.postMessage({ type: 'ccip_upload_done', key: key, filename: file.name }, '*');
      } else {
        st.style.color = '#ef5350';
        st.textContent = '✗ Erreur ' + xhr.status + ': ' + xhr.responseText.substring(0, 80);
      }
    };

    xhr.onerror = function() {
      st.style.color = '#ef5350';
      st.textContent = '✗ Connexion échouée — vérifier le serveur';
    };

    xhr.send(file);
  });
</script>
</body>
</html>
